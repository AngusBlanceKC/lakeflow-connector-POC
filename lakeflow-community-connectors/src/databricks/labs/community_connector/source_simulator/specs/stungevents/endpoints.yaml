# StungEvents public event listing endpoint.
endpoints:
  - path: "/events"
    method: GET
    corpus: events
    response:
      pagination_style: offset_limit
      default_sort: "start_utc asc"
      wrapper: {records_key: events, extras: {count: 0}, ignore_extra_keys: true}
    params:
      city: {role: filter, field: city, op: eq}
      country: {role: filter, field: country, op: eq}
      category: {role: filter, field: category, op: eq}
      from: {role: filter, field: start_utc, op: gte}
      to: {role: filter, field: start_utc, op: lte}
      limit: {role: limit, default: 100, max: 100}
      offset: {role: offset}
