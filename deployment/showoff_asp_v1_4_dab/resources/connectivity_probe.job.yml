resources:
  jobs:
    showoff_connectivity_probe:
      name: "LC-POC | ShowOff ASP v1.4 | probe"
      tasks:
        - task_key: probe
          spark_python_task:
            python_file: ../connectivity_probe.py
            parameters:
              - --base-url
              - ${var.base_url}
              - --api-key
              - ${var.api_key}
              - --api-secret
              - ${var.api_secret}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
