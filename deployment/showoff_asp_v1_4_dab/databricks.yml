bundle:
  name: showoff-asp-v1-4-connector
include:
  - resources/*.yml
variables:
  catalog:
    default: raw_angus
  schema:
    default: default
  cloudflare_url:
    description: Shared Cloudflare URL for the local API gateway.
    default: https://faced-switches-exclusive-suggested.trycloudflare.com
  api_key:
    default: demo-showoff-api-key
  api_secret:
    default: demo-showoff-api-secret
  site_uuid:
    default: demo-site-001
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-3990188733873176.16.azuredatabricks.net
