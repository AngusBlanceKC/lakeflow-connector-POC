resources:
  jobs:
    gevme_connectivity_probe:
      name: "LC-POC | GEVME | probe"
      tasks:
        - task_key: probe
          spark_python_task:
            python_file: ../connectivity_probe.py
            parameters:
              - --base-url
              - ${var.base_url}
              - --event-id
              - ${var.event_id}
              - --access-token
              - ${var.access_token}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
