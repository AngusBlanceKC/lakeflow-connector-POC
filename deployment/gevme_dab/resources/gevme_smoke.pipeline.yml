resources:
  pipelines:
    gevme_smoke_pipeline:
      name: "LC-POC | GEVME | smoke"
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      development: true
      channel: PREVIEW
      libraries:
        - file:
            path: ../gevme_smoke_pipeline.py
        - file:
            path: ../_generated_gevme_python_source.py
      configuration:
        gevme.base_url: ${var.base_url}
        gevme.event_id: ${var.event_id}
        gevme.access_token: ${var.access_token}
