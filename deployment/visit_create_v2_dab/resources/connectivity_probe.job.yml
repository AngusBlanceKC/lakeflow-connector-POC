resources:
  jobs:
    visit_create_v2_connectivity_probe:
      name: "LC-POC | Visit Create v2 | probe-${workspace.current_user.short_name}"
      tasks:
        - task_key: probe
          spark_python_task:
            python_file: ../connectivity_probe.py
            parameters:
              - --base-url
              - ${var.base_url}
              - --api-key
              - ${var.api_key}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
