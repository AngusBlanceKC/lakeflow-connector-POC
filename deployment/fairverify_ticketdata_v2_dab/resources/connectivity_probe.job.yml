resources:
  jobs:
    fairverify_connectivity_probe:
      name: "LC-POC | FairVerify Ticketdata v2 | probe"
      tasks:
        - task_key: probe
          spark_python_task:
            python_file: ../connectivity_probe.py
            parameters:
              - --base-url
              - ${var.base_url}
              - --event-id
              - ${var.event_id}
              - --api-key
              - ${var.api_key}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
