bundle:
  name: fusion-circdata-connector

include:
  - resources/*.yml

variables:
  catalog:
    default: raw_angus
  schema:
    default: default
  cloudflare_url:
    description: Shared Cloudflare URL for the local API gateway.
    default: https://faced-switches-exclusive-suggested.trycloudflare.com
  event_id:
    default: demo-event-001
  username:
    default: demo-user
  password:
    default: demo-password
  install_name:
    default: demo-install
  api_key:
    default: demo-api-key

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-3990188733873176.16.azuredatabricks.net
