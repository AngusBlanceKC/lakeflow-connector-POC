resources:
  jobs:
    fusion_connectivity_probe:
      name: fusion_circdata_connectivity_probe
      tasks:
        - task_key: probe
          spark_python_task:
            python_file: ../connectivity_probe.py
            parameters:
              - --base-url
              - ${var.base_url}
              - --event-id
              - ${var.event_id}
              - --username
              - ${var.username}
              - --password
              - ${var.password}
              - --install-name
              - ${var.install_name}
              - --api-key
              - ${var.api_key}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
