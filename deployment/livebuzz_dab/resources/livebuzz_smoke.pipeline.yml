resources:
  pipelines:
    livebuzz_smoke_pipeline:
      name: "LC-POC | LiveBuzz | smoke"
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      development: true
      channel: PREVIEW
      libraries:
        - file: {path: ../livebuzz_smoke_pipeline.py}
        - file: {path: ../_generated_livebuzz_python_source.py}
      configuration:
        livebuzz.base_url: ${var.base_url}
        livebuzz.campaign: ${var.campaign}
        livebuzz.api_key: ${var.api_key}
